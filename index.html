<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120E0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ranní rutina</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #120E0A; --ink: #F3E9DA; --muted: #9C8B77; --amber: #F2B24B; --hot: #FF8A3D; --line: #34281D; --card: #1B140E; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { color: var(--ink); font-family: 'Inter', sans-serif; font-size: 16px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .aura { position: fixed; left: 50%; top: 250px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(242,178,75,.30), rgba(255,138,61,.10) 45%, transparent 70%); opacity: var(--p, 0); transform: scale(calc(.6 + var(--p, 0) * .6)); transition: opacity .8s, transform .8s; }
  .app { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 26px 22px 110px; display: flex; flex-direction: column; align-items: center; }
  .view[hidden] { display: none; }
  .view { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .time { font-family: 'Instrument Serif', serif; font-size: 64px; line-height: 1; letter-spacing: -.02em; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 6px; text-transform: capitalize; }

  /* ranní poznámka z minulého večera */
  .morning { width: 100%; margin-top: 18px; padding: 14px 16px; border: 1px solid #4A3820; background: linear-gradient(135deg, rgba(242,178,75,.14), rgba(242,178,75,.04)); border-radius: 16px; animation: rise .6s cubic-bezier(.2,.9,.3,1); }
  .morning small { display: block; font-size: 14px; color: var(--amber); margin-bottom: 6px; }
  .morning p { white-space: pre-wrap; line-height: 1.45; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  .stage { perspective: 700px; margin: 22px 0 4px; position: relative; width: 200px; height: 200px; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
  .ring .t { stroke: #2A2016; } .ring .b { stroke: url(#grad); transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 6px rgba(242,178,75,.7)); }
  .lockwrap { width: 112px; transform-style: preserve-3d; transition: transform .15s ease-out; }
  .lock { width: 100%; overflow: visible; display: block; }
  .shackle { transform-origin: 28px 70px; transition: transform .9s cubic-bezier(.25,1.5,.4,1); }
  .bodyfill, .keyhole { transition: opacity .5s; }
  .shock { position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid var(--amber); opacity: 0; pointer-events: none; }
  .shock.go { animation: shock 1s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes shock { from { transform: scale(.5); opacity: .9; } to { transform: scale(4.2); opacity: 0; } }
  .lock.click { animation: click .35s ease-out; } @keyframes click { 30% { transform: scale(1.1) rotate(-3deg); } 60% { transform: scale(.97) rotate(2deg); } }
  .lock.slam { animation: slam .5s; } @keyframes slam { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  .open .lock { filter: drop-shadow(0 0 26px rgba(242,178,75,.65)); }
  .lock .sh { stroke: var(--lockc, #F3E9DA); transition: stroke .8s; }
  .lock .bd { stroke: var(--lockc, #F3E9DA); transition: stroke .8s; }
  .quote { max-width: 300px; text-align: center; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 20px; line-height: 1.3; color: #CDBBA3; margin-top: 14px; text-wrap: balance; }

  /* oslava milníku série */
  .ms { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(18,14,10,.82); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .4s; }
  .ms.on { opacity: 1; pointer-events: auto; }
  .ms .box { text-align: center; padding: 30px 34px; transform: scale(.8); transition: transform .6s cubic-bezier(.2,1.6,.4,1); }
  .ms.on .box { transform: none; }
  .ms .big { font-family: 'Instrument Serif', serif; font-size: 120px; line-height: 1; color: var(--amber); text-shadow: 0 0 40px rgba(242,178,75,.6); }
  .ms .what { font-family: 'Instrument Serif', serif; font-size: 30px; margin-top: 4px; }
  .ms .sub { color: var(--muted); font-size: 15px; margin-top: 10px; }
  .ms .btn { margin-top: 26px; color: var(--ink); border-color: var(--amber); }
  .open .keyhole { opacity: 0; }

  .pct { font-family: 'Instrument Serif', serif; font-size: 27px; margin: 2px 0 6px; height: 34px; }
  .pct span { color: var(--amber); }
  .pct .word { display: inline-block; opacity: 0; transform: translateY(10px) scale(.9); animation: word .5s forwards; }
  @keyframes word { to { opacity: 1; transform: none; } }
  .streak { font-size: 14px; color: var(--muted); margin-bottom: 18px; } .streak b { color: var(--amber); font-weight: 500; }

  ul { list-style: none; padding: 0; width: 100%; border-top: 1px solid var(--line); }
  li { display: flex; align-items: center; gap: 14px; padding: 16px 2px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; overflow: hidden; }
  li::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(242,178,75,.22), transparent); transform: translateX(-100%); pointer-events: none; }
  li.pop::after { animation: sweep .7s ease-out; } @keyframes sweep { to { transform: translateX(100%); } }
  .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; display: grid; place-items: center; transition: .3s; }
  .dot svg { width: 12px; transform: scale(0); transition: transform .35s cubic-bezier(.3,2,.5,1); }
  li.done .dot { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 16px rgba(242,178,75,.65); }
  li.done .dot svg { transform: scale(1); }
  li span { flex: 1; transition: color .3s; } li.done span { color: var(--muted); } li em { font-style: normal; font-size: 14px; color: var(--muted); }
  .foot { margin-top: 18px; font-size: 14px; color: var(--muted); text-align: center; }
  .open .foot { color: var(--amber); }

  /* poznámka na zítra */
  .note { width: 100%; margin-top: 22px; }
  .note label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); font: inherit; padding: 12px 14px; line-height: 1.4; }
  textarea:focus { outline: none; border-color: var(--amber); }
  .saved { font-size: 14px; color: var(--amber); height: 18px; margin-top: 6px; opacity: 0; transition: opacity .3s; } .saved.on { opacity: 1; }

  /* kalendář */
  .cal-head { width: 100%; display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; }
  .cal-head h2 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 30px; text-transform: capitalize; }
  .nav { background: none; border: 1px solid var(--line); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .grid { width: 100%; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .wd { text-align: center; font-size: 14px; color: var(--muted); }
  .c { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-size: 14px; background: #1A130D; color: var(--muted); border: 1px solid transparent; cursor: pointer; }
  .c.empty { background: none; cursor: default; }
  .c.ok { background: linear-gradient(135deg, var(--amber), var(--hot)); color: #120E0A; font-weight: 500; box-shadow: 0 0 14px rgba(242,178,75,.35); }
  .c.today { border-color: var(--amber); }
  .c.sel { outline: 2px solid var(--ink); outline-offset: 2px; }
  .stats { display: flex; gap: 10px; width: 100%; margin-top: 20px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; color: var(--amber); } .stat small { color: var(--muted); font-size: 14px; }
  .daynote { width: 100%; margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .daynote small { display: block; color: var(--muted); font-size: 14px; margin-bottom: 4px; }

  .tools { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn { background: none; border: 1px solid var(--line); color: var(--muted); font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 99px; cursor: pointer; }
  .btn:active { border-color: var(--amber); color: var(--ink); }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 40%); }
  .tabs div { display: flex; gap: 4px; padding: 4px; background: #1D150E; border: 1px solid var(--line); border-radius: 99px; }
  .tab { background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; padding: 10px 26px; border-radius: 99px; cursor: pointer; transition: .25s; }
  .tab.on { background: var(--amber); color: #120E0A; font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="aura" id="aura"></div>

<main class="app" id="app">
  <!-- ===== DNES ===== -->
  <section class="view" id="v-today">
    <div class="time" id="clock"></div>
    <div class="hint" id="date"></div>
    <div class="quote" id="quote"></div>
    <div class="morning" id="morning" hidden><small>Ty sám sobě z včerejšího večera</small><p id="morningText"></p></div>

    <div class="stage" id="stage">
      <svg class="ring" viewBox="0 0 210 210"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#F2B24B"/></linearGradient></defs>
        <circle class="t" cx="105" cy="105" r="98" fill="none" stroke-width="2"/>
        <circle class="b" id="arc" cx="105" cy="105" r="98" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="615.8" stroke-dashoffset="615.8"/></svg>
      <div class="shock" id="shock"></div>
      <div class="lockwrap" id="lockwrap">
        <svg class="lock" id="lock" viewBox="0 0 120 150" fill="none">
          <g class="shackle" id="shackle"><path class="sh" d="M28 72 V46 a32 32 0 0 1 64 0 V72" stroke-width="9" stroke-linecap="round"/></g>
          <rect class="bd" x="14" y="68" width="92" height="72" rx="14" fill="#1C150F" stroke-width="3"/>
          <rect class="bodyfill" id="fill" x="14" y="68" width="92" height="72" rx="14" fill="#F2B24B" opacity="0"/>
          <g class="keyhole"><circle cx="60" cy="98" r="7" fill="#120E0A"/><rect x="57" y="100" width="6" height="18" rx="3" fill="#120E0A"/></g>
        </svg>
      </div>
    </div>
    <div class="pct" id="pct"></div>
    <div class="streak" id="streak"></div>

    <ul id="list"></ul>
    <div class="foot" id="foot"></div>

    <div class="note">
      <label for="noteTomorrow">Poznámka na zítra ráno</label>
      <textarea id="noteTomorrow" placeholder="Co si chceš ráno připomenout?"></textarea>
      <div class="saved" id="saved">Uloženo</div>
    </div>
  </section>

  <!-- ===== KALENDÁŘ ===== -->
  <section class="view" id="v-cal" hidden>
    <div class="cal-head"><button class="nav" id="prev" aria-label="Předchozí měsíc">‹</button><h2 id="monthName"></h2><button class="nav" id="next" aria-label="Další měsíc">›</button></div>
    <div class="grid" id="wd"></div>
    <div class="grid" id="grid" style="margin-top:8px"></div>
    <div class="daynote" id="dayInfo" hidden></div>
    <div class="stats">
      <div class="stat"><b id="sCur">0</b><small>série</small></div>
      <div class="stat"><b id="sBest">0</b><small>rekord</small></div>
      <div class="stat"><b id="sTotal">0</b><small>celkem dní</small></div>
    </div>
    <div class="streak" id="nextMs" style="margin-top:16px"></div>
    <div class="tools">
      <button class="btn" id="exp">Stáhnout zálohu</button>
      <button class="btn" id="imp">Nahrát zálohu</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </section>
</main>

<div class="ms" id="ms"><div class="box"><div class="big" id="msNum"></div><div class="what" id="msWhat"></div><div class="sub" id="msSub"></div><button class="btn" id="msOk">Jedeme dál</button></div></div>

<nav class="tabs"><div><button class="tab on" data-v="today">Dnes</button><button class="tab" data-v="cal">Kalendář</button></div></nav>

<script>
  const $ = id => document.getElementById(id);
  const STEPS = [['Voda', 'sklenice'], ['Kreatin', '5 g'], ['Snídaně', ''], ['Příprava do školy', ''], ['Duolingo', '5 min']];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- data: ukládáme do prohlížeče telefonu (localStorage) ----------
  // store = { days: { 'YYYY-MM-DD': { steps: [bool x5], done: bool } }, notes: { 'YYYY-MM-DD': 'text' } }
  // notes[datum] je poznámka, která se má ukázat TO ráno
  let store = { days: {}, notes: {} };
  try { const raw = localStorage.getItem('rutina-v1'); if (raw) store = JSON.parse(raw); } catch (e) {}
  store.days = store.days || {}; store.notes = store.notes || {};
  function save() { try { localStorage.setItem('rutina-v1', JSON.stringify(store)); } catch (e) {} }

  const pad = n => String(n).padStart(2, '0');
  const key = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const todayDate = () => new Date();
  const todayKey = () => key(todayDate());
  function dayOf(k) { return store.days[k] || (store.days[k] = { steps: STEPS.map(() => false), done: false }); }

  // série = kolik dní v řadě je hotových (dnešek se počítá, jen když je hotový; jinak se jede od včerejška)
  function streaks() {
    const isDone = k => store.days[k] && store.days[k].done;
    let cur = 0, d = todayDate();
    if (!isDone(key(d))) d = addDays(d, -1);
    while (isDone(key(d))) { cur++; d = addDays(d, -1); }
    const keys = Object.keys(store.days).filter(isDone).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      const dt = new Date(k + 'T12:00:00');
      run = prev && Math.round((dt - prev) / 864e5) === 1 ? run + 1 : 1;
      best = Math.max(best, run); prev = dt;
    }
    return { cur, best, total: keys.length };
  }

  // ---------- milníky série a ranní věta ----------
  const MILESTONES = [[3, 'Rozjezd', 'Tři dny v řadě. Takhle se z toho stává zvyk.'], [7, 'Celý týden', 'Sedm dní bez výpadku. Zámek zlátne.'], [14, 'Dva týdny', 'Čtrnáct dní. Tohle už není náhoda.'], [30, 'Celý měsíc', 'Třicet dní. Zámek hoří.'], [100, 'Stovka', 'Sto dní v řadě. Máš to v krvi.']];
  // barva zámku podle délky série
  function tierColor(n) { return n >= 100 ? '#FFF1C2' : n >= 30 ? '#FF8A3D' : n >= 7 ? '#F2B24B' : n >= 3 ? '#F7D9A0' : '#F3E9DA'; }
  function nextMilestone(n) { return MILESTONES.find(m => m[0] > n); }

  const QUOTES = [
    'Nejtěžší je vstát. Zbytek už jede sám.', 'Malé kroky každý den porazí velké plány jednou za čas.', 'Ráno patří tomu, kdo ho nepromrhá mobilem.',
    'Dnes stačí udělat první krok.', 'Disciplína je pamatovat si, co opravdu chceš.', 'Nemusíš mít náladu. Stačí začít.',
    'Co uděláš ráno, nastaví celý den.', 'Jeden dobrý den za druhým a máš měsíc.', 'Mobil počká. Ty ne.',
    'Motivace přijde až po začátku, ne před ním.', 'Dnešní ty děkuje včerejšímu tobě.', 'Série se staví po jednom dni.',
    'Nejlepší čas začít byl včera, druhý nejlepší je teď.', 'Nesrovnávej se s ostatními, jen se včerejším sebou.', 'Klid a pravidelnost vyhrávají nad vášní.',
    'Zvyk je malý závazek, který ti vrací velké věci.', 'Dneska to zvládneš stejně jako včera.', 'Nejdřív voda, pak svět.',
    'Kdo ovládne ráno, ovládne den.', 'Nehledej čas, vytvoř si ho.', 'Silný člověk není ten, co nikdy nepadne, ale ten, co vstane.',
    'Každé odškrtnutí je hlas pro člověka, kterým chceš být.', 'Nepotřebuješ perfektní den, jen dokončenou rutinu.', 'Teď je to nepohodlné, za měsíc to bude normální.',
    'Ranní ty staví, večerní ty sklízí.', 'Pět drobností, které ti zbytek dne usnadní.', 'Trpělivost je taky druh pokroku.',
    'Ne zítra. Dnes.', 'Dělej to, i když to nikdo nevidí.', 'Cesta se dělá chůzí.', 'Jedna rutina, tisíc malých vítězství.',
  ];
  function dayOfYear(d) { return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5); }
  $('quote').textContent = QUOTES[dayOfYear(new Date()) % QUOTES.length];

  function celebrate(m, n) {
    $('msNum').textContent = n; $('msWhat').textContent = m[1]; $('msSub').textContent = m[2];
    $('ms').classList.add('on');
    const r = $('stage').getBoundingClientRect();
    for (let k = 0; k < 4; k++) setTimeout(() => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.25 + Math.random() * .35), 90, 1.6), k * 260);
    [392, 523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, .6 + k * .1, .7, .09));
    buzz([40, 60, 40, 60, 40, 60, 200]);
  }
  $('msOk').onclick = () => $('ms').classList.remove('on');

  // ---------- zvuk a vibrace ----------
  let ac;
  function tone(freq, t = 0, dur = .18, vol = .08, type = 'sine') {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + dur);
      o.connect(g).connect(ac.destination); o.start(s); o.stop(s + dur + .05);
    } catch (e) {}
  }
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ---------- částice ----------
  const cv = $('fx'), cx = cv.getContext('2d');
  let W, H, parts = [], progress = 0;
  const dpr = () => devicePixelRatio || 1;
  function size() { W = cv.width = innerWidth * dpr(); H = cv.height = innerHeight * dpr(); }
  addEventListener('resize', size); size();
  function ember() { parts.push({ x: Math.random() * W, y: H + 10, vx: (Math.random() - .5) * .3 * dpr(), vy: -(.3 + Math.random() * .6 + progress * 1.2) * dpr(), r: (.6 + Math.random() * 1.6) * dpr(), life: 1, d: .0025 + Math.random() * .003, ember: true }); }
  function burst(x, y, n, power = 1) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (1 + Math.random() * 5) * power * dpr();
      parts.push({ x: x * dpr(), y: y * dpr(), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2 * dpr(), r: (1 + Math.random() * 2.4) * dpr(), life: 1, d: .012 + Math.random() * .016, g: .08 * dpr() });
    }
  }
  (function loop() {
    cx.clearRect(0, 0, W, H); cx.globalCompositeOperation = 'lighter';
    if (!reduce && Math.random() < .25 + progress * .5) ember();
    parts = parts.filter(p => p.life > 0 && p.y > -20);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; if (p.g) p.vy += p.g; if (p.ember) p.x += Math.sin(p.y / 60) * .25; p.life -= p.d;
      cx.fillStyle = `rgba(${p.ember ? '255,150,60' : '255,205,110'},${Math.max(p.life, 0) * (p.ember ? .55 : 1)})`;
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
    }
    requestAnimationFrame(loop);
  })();

  addEventListener('pointermove', e => {
    if (reduce || $('v-today').hidden) return;
    const r = $('stage').getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / innerWidth, dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
    $('lockwrap').style.transform = `rotateY(${dx * 38}deg) rotateX(${-dy * 28}deg)`;
  });

  // ---------- obrazovka DNES ----------
  function renderToday(changed) {
    const day = dayOf(todayKey());
    $('list').innerHTML = STEPS.map((s, i) => `<li class="${day.steps[i] ? 'done' : ''}" data-i="${i}"><i class="dot"><svg viewBox="0 0 14 14" fill="none" stroke="#120E0A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3L11.5 4"/></svg></i><span>${s[0]}</span><em>${s[1]}</em></li>`).join('');
    document.querySelectorAll('#list li').forEach(li => li.onclick = e => toggle(+li.dataset.i, e));
    if (changed != null) { const li = document.querySelector(`#list li[data-i="${changed}"]`); li && li.classList.add('pop'); }

    const c = day.steps.filter(Boolean).length, p = c / STEPS.length; progress = p;
    const open = c === STEPS.length;
    $('arc').style.strokeDashoffset = 615.8 * (1 - p);
    $('aura').style.setProperty('--p', p);
    $('fill').setAttribute('opacity', p * .45);
    $('app').classList.toggle('open', open);
    $('shackle').style.transform = open ? 'translateY(-26px) rotate(-42deg)' : `translateY(${-p * 9}px) rotate(${-p * 6}deg)`;
    $('pct').innerHTML = open ? '<span class="word">Odemčeno</span>' : `<span>${Math.round(p * 100)}</span> % odemčeno`;
    $('foot').textContent = open ? 'Hezký den, Šimone. Mobil je tvůj.' : `Sociální sítě a hry čekají · zbývá ${STEPS.length - c}`;
    const st = streaks();
    document.documentElement.style.setProperty('--lockc', tierColor(st.cur));
    $('streak').innerHTML = st.cur ? `<b>${st.cur}</b> ${st.cur === 1 ? 'den' : st.cur < 5 ? 'dny' : 'dní'} v řadě · rekord ${st.best}` : 'Série začíná dnes';
  }

  function toggle(i, e) {
    const day = dayOf(todayKey());
    day.steps[i] = !day.steps[i];
    const wasLast = day.steps.every(Boolean);
    day.done = wasLast;
    save(); renderToday(day.steps[i] ? i : null);
    if (!day.steps[i]) { tone(220, 0, .15, .06); return; }
    const r = $('stage').getBoundingClientRect(), mx = r.left + r.width / 2, my = r.top + r.height / 2;
    if (e) burst(e.clientX, e.clientY, 14);
    $('lock').classList.remove('click'); void $('lock').offsetWidth; $('lock').classList.add('click');
    tone(520 + i * 90, 0, .16); buzz(18);
    if (wasLast) {
      burst(mx, my, 110, 1.5);
      const s = $('shock'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
      [523, 659, 784, 1047].forEach((f, k) => tone(f, k * .09, .5, .09));
      buzz([30, 40, 30, 40, 120]);
      // milník série: velká oslava (jen jednou za den)
      const cur = streaks().cur, m = MILESTONES.find(x => x[0] === cur);
      if (m && !day.celebrated) { day.celebrated = true; save(); setTimeout(() => celebrate(m, cur), 1300); }
    }
  }

  // ---------- poznámky ----------
  // co napíšu dnes do pole, se ráno zítra ukáže nahoře
  const tomorrowKey = () => key(addDays(todayDate(), 1));
  let saveT;
  $('noteTomorrow').addEventListener('input', e => {
    const v = e.target.value.trim();
    if (v) store.notes[tomorrowKey()] = v; else delete store.notes[tomorrowKey()];
    clearTimeout(saveT);
    saveT = setTimeout(() => { save(); $('saved').classList.add('on'); setTimeout(() => $('saved').classList.remove('on'), 1200); }, 400);
  });
  function renderNotes() {
    $('noteTomorrow').value = store.notes[tomorrowKey()] || '';
    const mine = store.notes[todayKey()];
    $('morning').hidden = !mine;
    if (mine) $('morningText').textContent = mine;
  }

  // ---------- KALENDÁŘ ----------
  let viewMonth = new Date(); viewMonth.setDate(1);
  let selected = null;
  $('wd').innerHTML = ['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'].map(d => `<div class="wd">${d}</div>`).join('');
  function renderCal() {
    $('monthName').textContent = viewMonth.toLocaleDateString('cs-CZ', { month: 'long', year: 'numeric' });
    const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
    let html = '<div class="c empty"></div>'.repeat(lead);
    for (let d = 1; d <= days; d++) {
      const k = y + '-' + pad(m + 1) + '-' + pad(d);
      const cls = ['c', store.days[k] && store.days[k].done ? 'ok' : '', k === todayKey() ? 'today' : '', k === selected ? 'sel' : ''].join(' ');
      html += `<div class="${cls}" data-k="${k}">${d}</div>`;
    }
    $('grid').innerHTML = html;
    document.querySelectorAll('#grid .c[data-k]').forEach(c => c.onclick = () => { selected = selected === c.dataset.k ? null : c.dataset.k; renderCal(); });
    const info = $('dayInfo');
    if (selected) {
      const n = store.notes[selected], dn = store.days[selected] && store.days[selected].done;
      info.hidden = false;
      info.innerHTML = `<small>${new Date(selected + 'T12:00:00').toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' })} · ${dn ? 'rutina hotová' : 'rutina nehotová'}</small>${n ? n.replace(/</g, '&lt;') : 'Bez poznámky.'}`;
    } else info.hidden = true;
    const st = streaks();
    $('sCur').textContent = st.cur; $('sBest').textContent = st.best; $('sTotal').textContent = st.total;
    const nm = nextMilestone(st.cur);
    $('nextMs').innerHTML = nm ? `Do milníku „${nm[1]}“ zbývá <b>${nm[0] - st.cur}</b> ${nm[0] - st.cur === 1 ? 'den' : nm[0] - st.cur < 5 ? 'dny' : 'dní'}` : 'Všechny milníky pokořeny.';
  }
  $('prev').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() - 1); renderCal(); };
  $('next').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() + 1); renderCal(); };

  // ---------- záloha ----------
  $('exp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(store)], { type: 'application/json' }));
    a.download = 'ranni-rutina-zaloha-' + todayKey() + '.json'; a.click();
  };
  $('imp').onclick = () => $('file').click();
  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      const d = JSON.parse(t);
      if (!d || typeof d.days !== 'object') throw new Error('špatný soubor');
      store = { days: d.days, notes: d.notes || {} }; save(); renderToday(); renderNotes(); renderCal();
    }).catch(() => alert('Tenhle soubor se nepodařilo načíst.'));
  };

  // ---------- záložky ----------
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    $('v-today').hidden = t.dataset.v !== 'today'; $('v-cal').hidden = t.dataset.v !== 'cal';
    if (t.dataset.v === 'cal') renderCal();
    scrollTo(0, 0);
  });

  // ---------- offline režim ----------
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

  // ---------- start ----------
  function header() {
    const n = new Date();
    $('clock').textContent = n.getHours() + ':' + pad(n.getMinutes());
    $('date').textContent = n.toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  header(); renderToday(); renderNotes();
  // když appka přes noc zůstala otevřená a začal nový den, obnov ji
  let shown = todayKey();
  setInterval(() => { header(); if (todayKey() !== shown) { shown = todayKey(); renderToday(); renderNotes(); } }, 30000);
</script>
</body>
</html>
